<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | Stride</title>
  <meta name="description" content="Review your Stride shopping cart. Adjust quantities, apply promo codes, and enjoy free shipping on orders over $75." />

  <!-- ======================== FONTS ======================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- =================== BOOTSTRAP (LOCAL) ================= -->
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />

  <!-- ================== TAILWIND (CDN) ===================== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Disable Tailwind's preflight so it doesn't clash with Bootstrap's resets
    tailwind.config = { corePlugins: { preflight: false } };
  </script>

  <!-- ================== CUSTOM CSS ========================= -->
  <link rel="stylesheet" href="./assets/css/index.css" />
  <link rel="stylesheet" href="./assets/css/pages/cart.css" />

  <!-- =================== FAVICON ========================== -->
  <!-- <link rel="icon" href="assets/images/favicon.ico" /> -->
</head>

<body class="font-['Inter']">

  <!-- ===================== NAVBAR PLACEHOLDER ===================== -->
  <!-- Injected dynamically by JS (navbar component) -->
  <site-header></site-header>

  <!-- ===================== MAIN CONTENT =========================== -->
  <main class=" py-4 py-lg-5 mt-3 ">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-2">
      <ol class="breadcrumb text-sm">
        <li class="breadcrumb-item"><a href="index.html" class="breadcrumb-link">Home</a></li>
        <li class="breadcrumb-item active text-[var(--color-primary-500)] font-semibold" aria-current="page">Shopping Cart</li>
      </ol>
    </nav>

    <!-- Page Title -->
    <h1 class="fw-bold text-3xl md:text-4xl mb-4 page-title">Shopping Cart</h1>

    <!-- ===================== GRID LAYOUT ========================== -->
    <div class="row g-4 g-lg-5">

      <!-- ============== LEFT COLUMN — Cart Items ================== -->
      <div class="col-lg-8">
        <section id="cart-section" aria-label="Cart Items">

          <!-- Table Header (visible on md+ screens) -->
          <div class="cart-table-header d-none d-md-flex row align-items-center py-3 px-3 mb-2">
            <div class="col-md-5 text-sm font-semibold uppercase tracking-wider cart-col-label">Product</div>
            <div class="col-md-2 text-sm font-semibold uppercase tracking-wider cart-col-label text-center">Price</div>
            <div class="col-md-3 text-sm font-semibold uppercase tracking-wider cart-col-label text-center">Quantity</div>
            <div class="col-md-2 text-sm font-semibold uppercase tracking-wider cart-col-label text-end">Total</div>
          </div>

          <!-- Dynamic Cart Items Container -->
          <div id="cart-items-container">
            <!-- JS renders cart item cards here -->
          </div>

          <!-- Bottom Actions -->
          <div id="cart-bottom-actions" class="d-flex justify-content-between align-items-center mt-4 px-1">
            <a href="index.html" class="continue-link text-sm font-medium flex items-center gap-1.5 transition-all duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5" /><polyline points="12 19 5 12 12 5" />
              </svg>
              Continue Shopping
            </a>
            <button id="btn-clear-cart" class="clear-cart-btn text-sm font-medium transition-all duration-200">
              Clear Cart
            </button>
          </div>

        </section>
      </div>

      <!-- ============== RIGHT COLUMN — Order Summary ============== -->
      <div class="col-lg-4">
        <aside class="order-summary-card sticky-lg-top" style="top: 100px;" aria-label="Order Summary">

          <h2 class="fw-bold text-xl mb-4 summary-title">Order Summary</h2>

          <!-- Promo Code -->
          <div class="mb-4">
            <label for="promo-input" class="text-sm font-semibold mb-2 d-block promo-label">Promo Code</label>
            <div class="d-flex gap-2">
              <input type="text" id="promo-input" class="form-control promo-input flex-grow-1"
                placeholder="Enter code" aria-label="Enter promo code" />
              <button id="btn-apply-promo" class="btn promo-apply-btn font-semibold text-sm px-4">Apply</button>
            </div>
            <p class="text-xs mt-1.5 promo-hint">Try: STRIDE20 for 20% off</p>
          </div>

          <!-- Divider -->
          <hr class="summary-divider" />

          <!-- Price Breakdown -->
          <div class="d-flex flex-column gap-3 mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-sm summary-label">Subtotal</span>
              <span id="summary-subtotal" class="text-sm font-semibold summary-value">$0</span>
            </div>
            <div id="discount-row" class="d-flex justify-content-between align-items-center d-none text-success">
              <span class="text-sm fw-bold">Discount (20%)</span>
              <span id="summary-discount" class="text-sm font-semibold">-$0</span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-sm summary-label">Shipping</span>
              <span id="summary-shipping" class="text-sm font-semibold summary-value">$5</span>
            </div>

            <!-- Free Shipping Dynamic Message -->
            <div id="free-shipping-msg" class="free-shipping-msg text-xs" role="status" aria-live="polite">
              <!-- JS updates this dynamically -->
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <span class="text-sm summary-label">Estimated Tax</span>
              <span id="summary-tax" class="text-sm font-semibold summary-value">$0</span>
            </div>
          </div>

          <!-- Divider -->
          <hr class="summary-divider" />

          <!-- Grand Total -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="font-bold text-base total-label">Total</span>
            <span id="summary-total" class="font-bold text-lg total-value">$0</span>
          </div>

          <!-- Checkout Button -->
          <button id="btn-checkout" class="btn checkout-btn w-100 py-3 font-semibold text-base mb-3 transition-all duration-200">
            Proceed to Checkout
          </button>

          <!-- Secure Checkout Badge -->
          <p class="text-center text-xs secure-badge d-flex align-items-center justify-content-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            Secure Checkout
          </p>

        </aside>
      </div>

    </div>
    <!-- /row -->

  </main>

  <!-- ================== EMPTY CART STATE ======================== -->
  <template id="empty-cart-template">
    <div class="empty-cart-state text-center py-5">
      <div class="empty-cart-icon mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto">
          <circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
      </div>
      <h2 class="fw-bold text-2xl mb-2 page-title">Your cart is empty</h2>
      <p class="text-sm mb-4 empty-cart-subtitle">Looks like you haven't added anything to your cart yet.</p>
      <a href="index.html" class="btn checkout-btn px-5 py-2.5 font-semibold text-sm transition-all duration-200">
        Start Shopping
      </a>
    </div>
  </template>
   
  <site-footer>

  </site-footer>
  <!-- =================== BOOTSTRAP JS (LOCAL) =================== -->
  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- =================== CART JS ================================ -->
   <script type="module" src="./assets/js/main.js"></script>
  <script type="module" src="./assets/js/pages/cart.js"></script>

</body>

</html>
