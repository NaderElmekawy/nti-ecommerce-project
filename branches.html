<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Branches | Stride</title>

    <!-- ======================== FONTS ======================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- =================== BOOTSTRAP (LOCAL) ================= -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />

    <!-- ================== CUSTOM CSS ========================= -->
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="stylesheet" href="assets/css/pages/branches.css" />

</head>
<body>
  <!-- ===================== NAVBAR ===================== -->
  <site-header></site-header>

    <!-- Header Section -->
    <section class="contact-header">
        <h1>Contact us</h1>
        <p>Stride is ready to provide the right solution according to your needs</p>
    </section>

    <!-- Main Contact Form -->
    <div class="container">
        <div class="row contact-container">
            <!-- Left Side -->
            <div class="col-md-6">
                <h3>Get in touch</h3>
                <p>Feel free to reach out to our team.</p>
                <div class="info-item">
                    <h5>Head Office</h5>
                    <p>Talaat Harb Street , Cairo , Egypt</p>
                </div>
                <div class="info-item">
                    <h5>Email Us</h5>
                    <p>support@stride.com</p>
                </div>
            </div>
            
            <!-- Right Side Form -->
            <div class="col-md-6">
                <h3>Send us a message</h3>
                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3"><input type="text" class="form-control" placeholder="Name"></div>
                        <div class="col-md-6 mb-3"><input type="text" class="form-control" placeholder="Company"></div>
                    </div>
                    <div class="mb-3"><input type="email" class="form-control" placeholder="Email"></div>
                    <div class="mb-3"><textarea class="form-control" rows="4" placeholder="Message"></textarea></div>
                    <button type="submit" class="btn btn-primary-stride">Send</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Map Section -->
    <section class="map-section">
        <div class="container">
            <div class="map-wrapper">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d55251.37451031098!2d31.25849255!3d30.059488450000003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14583fa60b21beeb%3A0x79dfb296e8423bba!2z2KfZhNmC2KfZh9ix2KnYjCDZhdit2KfZgdi42Kkg2KfZhNmC2KfZh9ix2KnigKw!5e0!3m2!1sar!2seg!4v1787096285965!5m2!1sar!2seg" width="100%" height="450" style="border:0; border-radius: 12px;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- JS -->
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/main.js" type="module"></script>

</body>
</html>
